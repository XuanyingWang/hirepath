<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HirePath</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-hd">
      <div class="lmark">
        <svg width="20" height="20" viewBox="0 0 22 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- H: left & right verticals, crossbar is a rising zigzag -->
          <line x1="1.5" y1="3" x2="1.5" y2="17" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <line x1="8.5" y1="3" x2="8.5" y2="17" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <polyline points="1.5,13 4,9 6,11 8.5,7"
                    stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- P: spine + bowl -->
          <line x1="12" y1="3" x2="12" y2="17" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <path d="M12 3 L17 3 Q20 3 20 6.5 Q20 10 17 10 L12 10"
                stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <div><div class="ltitle">HirePath</div><div class="lsub">SDE II Interview Prep</div></div>
      <button class="btn-settings-icon" id="addChBtn" title="添加章节 / Add chapter">＋</button>
      <button class="btn-settings-icon" id="themeBtn" onclick="toggleThemePanel()" title="主题设置">🌙</button>
      <button class="btn-settings-icon" id="settingsBtn" title="API Key 设置">⚙️</button>
    </div>
    <div class="theme-panel" id="themePanel" style="display:none">
      <div class="theme-panel-modes">
        <button class="theme-mode-btn" id="themeModeLight" onclick="setThemeMode('light')">☀️ 浅色</button>
        <button class="theme-mode-btn" id="themeModeDark"  onclick="setThemeMode('dark')">🌙 深色</button>
      </div>
      <div class="theme-dots" id="themeDots"></div>
    </div>
    <div class="sb-body" id="sbBody"></div>
    <div id="sb-footer" class="sb-footer"></div>
  </aside>
  <div class="main">
    <div class="topbar" id="topbar" style="display:none">
      <span class="topbar-title" id="topbarTitle"></span>
      <button class="tab-btn active" data-tab="knowledge" id="tabKnowledge">知识框架</button>
      <button class="tab-btn" data-tab="quiz" id="tabQuiz">Quiz 练习</button>
      <button class="tab-btn" data-tab="flashcard" id="tabFlashcard">🃏 闪卡</button>
    </div>
    <div class="content" id="mainContent"></div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>

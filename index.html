<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L5 SDE Interview Prep</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-hd">
      <div class="lmark">🎯</div>
      <div><div class="ltitle">L5 Prep</div><div class="lsub">Google SDE Interview</div></div>
      <button class="btn-settings-icon" id="addChBtn" title="添加章节 / Add chapter">＋</button>
      <button class="btn-settings-icon" id="settingsBtn" title="API Key 设置">⚙️</button>
    </div>
    <div class="sb-body" id="sbBody"></div>
    <div id="sb-footer" class="sb-footer"></div>
  </aside>
  <div class="main">
    <div class="topbar" id="topbar" style="display:none">
      <span class="topbar-title" id="topbarTitle"></span>
      <button class="tab-btn active" data-tab="knowledge" id="tabKnowledge">知识框架</button>
      <button class="tab-btn" data-tab="quiz" id="tabQuiz">Quiz 练习</button>
      <button class="tab-btn" data-tab="flashcard" id="tabFlashcard">🃏 闪卡</button>
    </div>
    <div class="content" id="mainContent"></div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
